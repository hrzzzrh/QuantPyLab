[experiment]
name = "research-validity-smoke"
selection_metric = "sharpe_ratio"
selection_direction = "max"
candidate_configs = ["../config/backtest/factor_experiment_reversal.toml"]

[training]
enabled = true
label_horizon_days = 20
ridge_alpha = 0.1
max_iterations = 5000
minimum_training_observations = 200
minimum_training_dates = 24

[validity]
enabled = true
minimum_training_signal_dates = 24
minimum_validation_signal_dates = 11
minimum_test_signal_dates = 11
minimum_validation_observations = 100
minimum_test_observations = 100

[split]
train_start_date = "2018-01-01"
train_end_date = "2020-12-31"
validation_start_date = "2021-01-01"
validation_end_date = "2021-12-31"
test_start_date = "2022-01-01"
test_end_date = "2022-12-31"

[walk_forward]
enabled = true
start_date = "2018-01-01"
end_date = "2022-12-31"
train_years = 3
validation_years = 1
test_years = 1
step_years = 1
