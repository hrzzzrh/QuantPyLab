[experiment]
name = "multi-factor-quality-value-momentum-training-smoke"
selection_metric = "sharpe_ratio"
selection_direction = "max"
candidate_configs = ["../config/backtest/multi_factor_quality_value_momentum.toml"]

[training]
enabled = true
label_horizon_days = 20
ridge_alpha = 0.1
max_iterations = 5000
minimum_training_observations = 100
minimum_training_dates = 12
max_training_cache_entries = 1

[validity]
enabled = true
minimum_training_signal_dates = 12
minimum_validation_signal_dates = 6
minimum_test_signal_dates = 6
minimum_validation_observations = 20
minimum_test_observations = 20

[hyperparameter_search]
enabled = true
max_combinations = 4
holding_counts = [20]
winsorize_ranges = [[0.05, 0.95]]
ridge_alphas = [0.1]

[split]
train_start_date = "2021-01-01"
train_end_date = "2022-12-31"
validation_start_date = "2023-01-01"
validation_end_date = "2023-12-31"
test_start_date = "2024-01-01"
test_end_date = "2024-12-31"

[walk_forward]
enabled = false
