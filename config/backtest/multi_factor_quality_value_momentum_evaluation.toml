[experiment]
name = "multi-factor-quality-value-momentum-training"
selection_metric = "sharpe_ratio"
selection_direction = "max"
candidate_configs = ["multi_factor_quality_value_momentum.toml"]

[training]
enabled = true
label_horizon_days = 20
ridge_alpha = 0.1
max_iterations = 5000
minimum_training_observations = 200
minimum_training_dates = 24
max_training_cache_entries = 2

[validity]
enabled = true
minimum_training_signal_dates = 24
minimum_validation_signal_dates = 20
minimum_test_signal_dates = 20
minimum_validation_observations = 100
minimum_test_observations = 100

[hyperparameter_search]
enabled = true
max_combinations = 100
holding_counts = [10, 20, 50]
winsorize_ranges = [[0.05, 0.95], [0.10, 0.90]]
ridge_alphas = [0.1, 1.0]

[split]
train_start_date = "2017-07-01"
train_end_date = "2020-06-30"
validation_start_date = "2020-07-01"
validation_end_date = "2022-06-30"
test_start_date = "2022-07-01"
test_end_date = "2024-06-30"

[walk_forward]
enabled = true
start_date = "2011-01-01"
end_date = "2025-12-31"
train_years = 3
validation_years = 2
test_years = 2
step_years = 1
