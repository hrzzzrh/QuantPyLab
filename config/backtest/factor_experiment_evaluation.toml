[experiment]
name = "factor-experiment-walk-forward"
selection_metric = "sharpe_ratio"
selection_direction = "max"
candidate_configs = [
  "factor_experiment_reversal.toml",
  "factor_experiment_value_growth.toml",
]

[training]
enabled = true
label_horizon_days = 20
ridge_alpha = 0.1
max_iterations = 5000
minimum_training_observations = 200
minimum_training_dates = 6

[hyperparameter_search]
enabled = true
max_combinations = 100
holding_counts = [10, 20, 50]
winsorize_ranges = [[0.05, 0.95], [0.10, 0.90]]
ridge_alphas = [0.1, 1.0]

[hyperparameter_search.factor_parameters.price_reversal_20d]
lookback_days = [10, 20]

[split]
train_start_date = "2020-01-01"
train_end_date = "2022-12-31"
validation_start_date = "2023-01-01"
validation_end_date = "2024-12-31"
test_start_date = "2025-01-01"
test_end_date = "2026-08-07"

[walk_forward]
enabled = true
start_date = "2018-01-01"
end_date = "2026-08-07"
train_years = 3
validation_years = 1
test_years = 1
step_years = 1
